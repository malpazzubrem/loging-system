<!DOCTYPE html>
<html>
    <head>
        <title>login</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles_login.css') }}">
    </head>

    <body>

        <p>Log in</p>
        
        <form method="post">
            <input type="text" placeholder="username" name="username" class="username">
            <input type="password" placeholder="password" name="password" class="password">
            <button type="submit" value="submit" id="submit">Log in</button>
        </form>
        
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

    </body>
</html>
